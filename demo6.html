<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        *{
            box-sizing: border-box;
        
        }
        body{
            margin :0 ;
            font-family: Arial, Helvetica, sans-serif;
        }
        header{
            background-color: black;
            display: flex;
            justify-content: space-between;
            border-radius: 200px;
            color:white;
            padding: 20px;
            align-items: center
        }
        h1{
            font-size: 28px;
        }
        header a{
            color: white;
             background-color: skyblue;
            padding: 10px 20px;
            border-radius: 18px;
            text-decoration: none;

        }
        #layout{
            display: flex;
            gap: 20px;
            margin-top: 20px;

        }
        aside{
            background-color: grey;
            color: aqua;
            padding:15px ;
            border-radius: 35px;
        
        }
        aside nav{
            display: flex;
            flex-direction: column;
            gap: 20px;
            
        }
        aside nav a{
            color: yellow;
            text-decoration: none;
            padding: 5px;
        }
        main{
            flex: 1;
        }
        footer{
            background-color: black;
            color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: center;


        }
        #courses{
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .course{
            flex-grow: 0;
            flex-shrink: 0;
            flex-basis: calc((100% - 20px) / 2);
            background-color: skyblue;
            padding: 20px;
            padding: 20px;
            border-radius: 15px;

        }
    </style>
</head>
<body>
    <header>
        <h1>Student Dashboard</h1>
        <a href="#">Profile</a>
    </header>
    <div id="layout">
        <aside>
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Courses</a>
                <a href="#">Grades</a>
            </nav>
        </aside>
        <main>
            <h2>My Courses</h2>
            <div id="courses">
                <div class="course">HTML</div>
                <div class="course">CSS</div>
                <div class="course">JavaScript</div>
                <div class="course">Node.js</div>
            </div>
        </main>
    </div>
    <footer>
        &copy; 2024 Student Dashboard. All rights reserved.
    </footer>
</body>
</html>
